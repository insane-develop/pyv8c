[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyv8c"
version = "0.1.0"
description = "A deterministic Chromium-like BOM/DOM environment on pyv8"
requires-python = ">=3.12"
dependencies = ["loguru>=0.7", "websockets>=14"]

[project.optional-dependencies]
# The default engines: curl_cffi performs requests, websockets opens sockets.
# ``websockets`` is already a hard dependency; naming it here documents the pair.
network = ["curl_cffi>=0.7", "websockets>=14"]
# The cycronet engine is optional and serves either role when it is chosen.
cronet = ["cycronet>=144.4.7,<151"]
# The drawing surface behind CanvasRenderingContext2D and OffscreenCanvas pixels.
canvas = ["Pillow>=10"]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.2",
    "pytest-repeat>=0.9",
    "pytest-xdist>=3.6",
    "Pillow>=10",
]
# The reference browser for tests/repros.  It drives the Chrome already installed on
# the machine (PYV8C_CHROME points it elsewhere); nothing else is downloaded.
reference = ["playwright>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``slow`` marks coverage that drives a real browser, runs the whole unit suite
# again, or reaches a V8 heap limit; those belong on their own channel, which
# ``-m slow`` selects and ``-o addopts=--strict-markers`` puts back in a full run.
addopts = "--strict-markers -m 'not slow'"
# Safety net against a wedged realm: no single test may hang the suite.
timeout = 300
markers = [
    "native: requires the compiled _pyv8 extension",
    "race: timing-sensitive concurrency regression; run repeatedly with pytest-repeat",
    "slow: long-running stress coverage",
]

[tool.setuptools]
# Only the globs below ship: a sidecar or a binary cache next to the archive is a local
# artifact, and stale egg-info would otherwise pull it in by name.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pyv8c*"]
exclude = ["build*", "dist*", "tests*"]

[tool.setuptools.package-data]
pyv8c = ["data/*.json"]
# The document travels inside the package that reads it, so ``engine/idl.py`` finds it next to
# itself; its sidecar and binary cache are local artifacts and never ship.
"pyv8c.idl" = ["idl.zip"]
